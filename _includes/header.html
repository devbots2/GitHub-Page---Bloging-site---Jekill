<header class="site-header">
  <div class="container header-container">
    <!-- Brand / Logo -->
    <a href="{{ '/' | relative_url }}" class="site-logo">
      {% if site.logo %}
      <img src="{{ site.logo | relative_url }}" alt="{{ site.title }}" style="height: 38px; width: 38px; border-radius: 0; object-fit: contain;">
      {% endif %}
      <span>{{ site.title }}</span>
    </a>

    <!-- Navigation links & Theme Switcher -->
    <nav class="site-nav">
      <ul class="nav-links">
        <li>
          <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a>
        </li>
        <li>
          <a href="{{ '/blogs/' | relative_url }}" class="nav-link {% if page.url contains '/blogs/' %}active{% endif %}">Blogs</a>
        </li>
        <li>
          <a href="{{ '/about/' | relative_url }}" class="nav-link {% if page.url == '/about/' %}active{% endif %}">About</a>
        </li>
      </ul>

      <!-- Theme Switch Toggle Button -->
      <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle dark/light theme">
        <!-- Sun Icon (shown in dark theme) -->
        <svg class="sun-icon" viewBox="0 0 24 24" style="display: var(--display-sun, none);">
          <path d="M12 7a5 5 0 110 10 5 5 0 010-10zm0 2a3 3 0 100 6 3 3 0 000-6zm0-8a1 1 0 011 1v2a1 1 0 11-2 0V2a1 1 0 011-1zm0 18a1 1 0 011 1v2a1 1 0 11-2 0v-2a1 1 0 011-1zM5.64 4.22a1 1 0 011.41 0l1.42 1.42a1 1 0 01-1.42 1.41L5.64 5.64a1 1 0 010-1.42zm11.31 11.31a1 1 0 011.42 0l1.41 1.42a1 1 0 11-1.41 1.41l-1.42-1.41a1 1 0 010-1.42zM1 12a1 1 0 011-1h2a1 1 0 110 2H2a1 1 0 01-1-1zm18 0a1 1 0 011-1h2a1 1 0 110 2h-2a1 1 0 01-1-1zM5.64 19.78a1 1 0 001.41 0l1.42-1.42a1 1 0 10-1.42-1.41l-1.42 1.42a1 1 0 000 1.41zm11.31-11.3a1 1 0 001.42 0l1.41-1.42a1 1 0 00-1.41-1.41l-1.42 1.41a1 1 0 000 1.42z"/>
        </svg>
        <!-- Moon Icon (shown in light theme) -->
        <svg class="moon-icon" viewBox="0 0 24 24" style="display: var(--display-moon, block);">
          <path d="M12.3 22h-.1c-5.5 0-10-4.5-10-10 0-4.8 3.5-8.9 8.2-9.8.5-.1 1 .2 1.2.7.2.5 0 1.1-.4 1.4-2.8 1.9-4.2 5.4-3.5 8.7.7 3.3 3.3 5.9 6.6 6.6 3.3.7 6.8-.7 8.7-3.5.3-.4.9-.6 1.4-.4.5.2.8.7.7 1.2-.9 4.7-5 8.1-9.8 8.1zm-4-16.7C5.3 7 3.7 9.8 3.7 12c0 4.6 3.7 8.3 8.3 8.3 2.2 0 5-1.6 6.7-4.6-4.9.4-9.3-3-9.9-8.4-.1-.4-.1-.8 0-1.2v-.8z"/>
        </svg>
      </button>
    </nav>
  </div>
</header>

<style>
  /* Custom styles for showing/hiding theme icons dynamically based on custom data attributes */
  [data-theme="dark"] {
    --display-sun: block;
    --display-moon: none;
  }
  [data-theme="light"] {
    --display-sun: none;
    --display-moon: block;
  }
</style>
