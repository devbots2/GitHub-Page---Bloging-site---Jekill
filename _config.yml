# Site Settings
title: "DevBotS2"
tagline: "Insights on Networks, Data, AI & Robotics"
description: "Professional tech blog covering Network Engineering, Data Engineering, AI, Robotics, and AI Productivity."
url: "https://devbots2.github.io" # the base hostname & protocol for your site, e.g. http://username.github.io
baseurl: "/GitHub-Page---Bloging-site---Jekill" # the subpath of your site, e.g. /blog
logo: "/assets/images/logo.svg"

# Author Details (SEO Plugin Compatibility)
author:
  name: "DevBotS2 Team"
  email: "contact@devbots2.com"

# Team Profiles (For About Page)
authors:
  - name: "Engineer One"
    role: "Lead Networks & AI Engineer"
    email: "engineer1@devbots2.com"
    bio: "Specializing in network design, simulation LABs, Robotics, and AI model deployments."
    avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=engineer1"
    social:
      github: "devbots2"
      linkedin: "devbots2"
  - name: "Engineer Two"
    role: "Lead Data & Systems Engineer"
    email: "engineer2@devbots2.com"
    bio: "Specializing in distributed data pipelines, AI assistants, and automated workflows."
    avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=engineer2"
    social:
      github: "devbots2"
      linkedin: "devbots2"

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: /blogs/:title/

# Pagination
paginate: 6
paginate_path: "/blogs/page:num/"

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude list from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .github/
  - .git/
  - LICENSE.txt
  - README.md
