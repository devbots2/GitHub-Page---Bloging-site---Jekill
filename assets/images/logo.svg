<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagon Border -->
  <polygon points="100,15 175,58 175,142 100,185 25,142 25,58" 
           fill="none" 
           stroke="url(#brandGrad)" 
           stroke-width="8" 
           stroke-linejoin="round"
           filter="url(#glow)" />

  <!-- Inner Hexagon Grid -->
  <polygon points="100,30 160,65 160,135 100,170 40,135 40,65" 
           fill="none" 
           stroke="rgba(255, 255, 255, 0.15)" 
           stroke-width="3" 
           stroke-linejoin="round" />

  <!-- Robot / AI Eyes and circuits in center -->
  <!-- Circuit Paths -->
  <path d="M 70,100 L 130,100 M 100,70 L 100,130" 
        stroke="url(#brandGrad)" 
        stroke-width="4" 
        stroke-linecap="round" />
  
  <!-- Glowing Eye Nodes -->
  <circle cx="70" cy="100" r="12" fill="url(#brandGrad)" filter="url(#glow)" />
  <circle cx="70" cy="100" r="4" fill="#ffffff" />
  
  <circle cx="130" cy="100" r="12" fill="url(#brandGrad)" filter="url(#glow)" />
  <circle cx="130" cy="100" r="4" fill="#ffffff" />

  <!-- Tech Antenna Top -->
  <line x1="100" y1="70" x2="100" y2="45" stroke="url(#brandGrad)" stroke-width="5" stroke-linecap="round" />
  <circle cx="100" cy="45" r="8" fill="#ffffff" filter="url(#glow)" />

  <!-- Subtle grid lines connecting eyes to outer ring -->
  <line x1="70" y1="100" x2="40" y2="65" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />
  <line x1="130" y1="100" x2="160" y2="65" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />
</svg>
