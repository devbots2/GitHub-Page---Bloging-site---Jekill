---
layout: default
---
<article class="page">
  <header class="post-header">
    <h1 class="post-headline">{{ page.title }}</h1>
    {% if page.description %}
    <p class="hero-subtitle" style="margin-bottom: 0;">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="post-body" style="max-width: 800px; margin: 0 auto;">
    {{ content }}
  </div>
</article>
